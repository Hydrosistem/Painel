<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Hydrosistem — Equipe</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root {
  --azul:       #1469C7;
  --azul-esc:   #0A3F7F;
  --azul-md:    #1D5FAA;
  --azul-bg:    #EBF3FD;
  --azul-b:     #B8D4F4;
  --verde:      #15803D;
  --verde-bg:   #DCFCE7;
  --verde-b:    #86EFAC;
  --amarelo:    #A16207;
  --amarelo-bg: #FEF9C3;
  --vermelho:   #B91C1C;
  --vermelho-bg:#FEE2E2;
  --vermelho-b: #FCA5A5;
  --exec:       #7C3AED;
  --exec-bg:    #EDE9FE;
  --exec-b:     #A78BFA;
  --cinza:      #F1F5F9;
  --texto:      #0F172A;
  --texto2:     #64748B;
  --texto3:     #94A3B8;
  --borda:      #E2E8F0;
  --borda-md:   #CBD5E1;
  --branco:     #FFFFFF;
  --sombra-sm:  0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
  --sombra-md:  0 4px 6px -1px rgba(0,0,0,.08), 0 2px 4px -2px rgba(0,0,0,.04);
  --sombra-lg:  0 10px 15px -3px rgba(0,0,0,.08), 0 4px 6px -4px rgba(0,0,0,.04);
  --radius:     12px;
  --radius-sm:  8px;
  --radius-xs:  6px;
  --header-h:   60px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; font-family: "DM Sans", -apple-system, sans-serif; background: var(--cinza); color: var(--texto); overflow: hidden; }

/* HEADER */
header {
  background: var(--azul-esc); height: var(--header-h);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; position: sticky; top: 0; z-index: 100;
  border-bottom: 1px solid rgba(255,255,255,.08);
}
.h-brand { display: flex; align-items: center; gap: 12px; }
.h-logo { width: 34px; height: 34px; border-radius: 9px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.h-logo img { width: 100%; height: 100%; object-fit: contain; border-radius: 7px; }
.h-nome { font-size: 14px; font-weight: 700; color: #fff; letter-spacing: .5px; }
.h-sub  { font-size: 10px; color: rgba(255,255,255,.5); font-weight: 500; letter-spacing: 1.4px; text-transform: uppercase; }
.h-btns { display: flex; gap: 8px; align-items: center; }
.btn-h {
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14);
  color: rgba(255,255,255,.85); border-radius: var(--radius-sm); padding: 0 12px; height: 32px;
  font-size: 12px; font-family: "DM Sans",sans-serif; font-weight: 600;
  cursor: pointer; display: flex; align-items: center; gap: 6px; text-decoration: none;
  transition: background .15s;
}
.btn-h:hover { background: rgba(255,255,255,.14); }

.live-dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; flex-shrink: 0; animation: pulseG 2s ease-in-out infinite; }
@keyframes pulseG { 0% { box-shadow: 0 0 0 0 rgba(74,222,128,.5); } 60% { box-shadow: 0 0 0 4px rgba(74,222,128,0); } 100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); } }

/* LAYOUT */
.layout {
  display: grid;
  grid-template-columns: 300px 1fr;
  height: calc(100vh - var(--header-h));
  overflow: hidden;
}

/* SIDEBAR */
.sidebar {
  background: var(--branco); border-right: 1px solid var(--borda);
  display: flex; flex-direction: column; overflow: hidden;
}
.sb-header {
  padding: 12px 14px 10px; border-bottom: 1px solid var(--borda);
  display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
}
.sb-titulo { font-size: 13px; font-weight: 700; color: var(--texto); }
.sb-badge { font-size: 11px; font-weight: 700; font-family: "DM Mono",monospace; background: var(--verde-bg); color: var(--verde); border: 1px solid var(--verde-b); border-radius: 20px; padding: 2px 9px; }
.sb-badge.zero { background: var(--cinza); color: var(--texto3); border-color: var(--borda); }

.sb-stats { display: grid; grid-template-columns: repeat(3,1fr); border-bottom: 1px solid var(--borda); flex-shrink: 0; }
.sb-stat { padding: 10px 6px; text-align: center; border-right: 1px solid var(--borda); }
.sb-stat:last-child { border-right: none; }
.sb-stat-n { font-size: 20px; font-weight: 700; font-family: "DM Mono",monospace; line-height: 1; }
.sb-stat-l { font-size: 9px; font-weight: 600; letter-spacing: .8px; text-transform: uppercase; color: var(--texto3); margin-top: 2px; }
.sb-stat.s-on  .sb-stat-n { color: var(--verde); }
.sb-stat.s-ex  .sb-stat-n { color: var(--exec); }
.sb-stat.s-gps .sb-stat-n { color: var(--azul); }

.sb-lista { flex: 1; overflow-y: auto; padding: 6px 0; }
.op-card {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; cursor: pointer;
  border-radius: var(--radius-sm); margin: 2px 6px;
  transition: background .12s; border: 1.5px solid transparent;
}
.op-card:hover { background: var(--cinza); }
.op-card.selected { background: var(--azul-bg); border-color: var(--azul-b); }
.op-card.selected.exec { background: var(--exec-bg); border-color: var(--exec-b); }
.op-card.offline { opacity: .65; }

.op-avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; color: #fff; flex-shrink: 0; position: relative; }
.op-avatar-status { position: absolute; bottom: 0; right: 0; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--branco); }

.op-info { flex: 1; min-width: 0; }
.op-nome { font-size: 13px; font-weight: 700; color: var(--texto); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.op-status { font-size: 11px; color: var(--texto2); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.op-status.exec { color: var(--exec); font-weight: 600; }
.op-status.online { color: var(--verde); }
.op-status.offline { color: var(--texto3); }

.op-right { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex-shrink: 0; }
.op-concl { font-size: 10px; font-weight: 700; color: var(--verde); background: var(--verde-bg); border-radius: 20px; padding: 2px 7px; white-space: nowrap; }
.op-concl.zero { color: var(--texto3); background: var(--cinza); }
.op-gps { font-size: 12px; }

.sb-footer { padding: 8px 14px; border-top: 1px solid var(--borda); font-size: 11px; color: var(--texto3); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.btn-refresh { background: none; border: 1px solid var(--borda); color: var(--azul); border-radius: var(--radius-xs); padding: 3px 10px; font-size: 11px; font-weight: 600; cursor: pointer; font-family: "DM Sans",sans-serif; transition: background .12s; }
.btn-refresh:hover { background: var(--azul-bg); }

.sb-vazio { padding: 32px 16px; text-align: center; color: var(--texto3); font-size: 13px; line-height: 1.6; }

/* DETALHE */
.detalhe { display: flex; flex-direction: column; overflow: hidden; background: var(--cinza); }
.det-vazio { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--texto2); text-align: center; padding: 32px; }
.det-vazio-icon { font-size: 40px; opacity: .4; }
.det-vazio-txt  { font-size: 14px; font-weight: 600; color: var(--texto2); }
.det-vazio-sub  { font-size: 12px; color: var(--texto3); line-height: 1.5; }
.det-content { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }

/* Hero */
.det-hero { background: var(--branco); border-radius: var(--radius); border: 1px solid var(--borda); padding: 16px; display: flex; align-items: center; gap: 14px; box-shadow: var(--sombra-sm); }
.det-avatar-big { width: 50px; height: 50px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; color: #fff; position: relative; }
.det-avatar-big .op-avatar-status { width: 14px; height: 14px; border-width: 2.5px; }
.det-hero-info { flex: 1; min-width: 0; }
.det-nome { font-size: 17px; font-weight: 700; color: var(--texto); }
.det-sub  { font-size: 12px; color: var(--texto2); margin-top: 2px; }
.det-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; border: 1px solid transparent; white-space: nowrap; }
.badge.online  { background: var(--verde-bg);  color: var(--verde);  border-color: var(--verde-b); }
.badge.offline { background: var(--cinza);      color: var(--texto3); border-color: var(--borda); }
.badge.exec    { background: var(--exec-bg);    color: var(--exec);   border-color: var(--exec-b); }
.badge.gps-on  { background: var(--azul-bg);    color: var(--azul);   border-color: var(--azul-b); }
.badge.gps-off { background: var(--cinza);      color: var(--texto3); border-color: var(--borda); }

/* Botão redistribuir */
.btn-redistribuir {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 14px; border-radius: var(--radius-sm);
  border: 1px solid var(--exec-b); background: var(--exec-bg);
  color: var(--exec); font-size: 12px; font-weight: 700;
  cursor: pointer; font-family: "DM Sans",sans-serif;
  transition: background .15s; flex-shrink: 0;
}
.btn-redistribuir:hover { background: #DDD6FE; }

/* Mini cards */
.det-grid4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
.det-grid3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
.mini-card { background: var(--branco); border-radius: var(--radius-sm); border: 1px solid var(--borda); padding: 12px 10px; text-align: center; box-shadow: var(--sombra-sm); }
.mini-card-val { font-family: "DM Mono",monospace; font-size: 17px; font-weight: 700; line-height: 1; color: var(--texto); }
.mini-card-lbl { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .9px; color: var(--texto3); margin-top: 3px; }
.mini-card-val.verde  { color: var(--verde); }
.mini-card-val.exec   { color: var(--exec); }
.mini-card-val.azul   { color: var(--azul); }
.mini-card-val.texto3 { color: var(--texto3); }

/* Seções */
.det-section { background: var(--branco); border-radius: var(--radius); border: 1px solid var(--borda); padding: 14px 16px; box-shadow: var(--sombra-sm); }
.det-section.exec-border { border-color: var(--exec-b); }
.det-section-title { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; color: var(--texto3); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.det-section-title::after { content: ""; flex: 1; height: 1px; background: var(--borda); }
.det-row { display: flex; flex-direction: column; gap: 2px; margin-bottom: 8px; }
.det-row:last-child { margin-bottom: 0; }
.det-row-lbl { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--texto3); }
.det-row-val { font-size: 13px; color: var(--texto); line-height: 1.4; }
.det-row-val a { color: var(--azul); font-weight: 600; text-decoration: none; }

/* Histórico */
.hist-item { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--borda); }
.hist-item:last-child { border-bottom: none; }
.hist-stripe { width: 4px; border-radius: 2px; align-self: stretch; min-height: 28px; flex-shrink: 0; }
.hist-info { flex: 1; min-width: 0; }
.hist-end  { font-size: 12px; font-weight: 600; color: var(--texto); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hist-meta { font-size: 11px; color: var(--texto2); margin-top: 1px; }
.hist-dur  { font-size: 11px; font-family: "DM Mono",monospace; color: var(--texto3); flex-shrink: 0; }

/* Mapa */
.det-mapa-wrap { background: var(--branco); border-radius: var(--radius); border: 1px solid var(--borda); overflow: hidden; box-shadow: var(--sombra-sm); flex-shrink: 0; }
.det-mapa-header { padding: 10px 14px; border-bottom: 1px solid var(--borda); display: flex; align-items: center; justify-content: space-between; }
.det-mapa-titulo { font-size: 12px; font-weight: 700; color: var(--texto); display: flex; align-items: center; gap: 6px; }
.det-mapa-atualizado { font-size: 11px; color: var(--texto3); }
#mapaOperador { height: 260px; width: 100%; display: block; }
.det-mapa-vazio { height: 160px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--texto3); font-size: 13px; }
.det-mapa-vazio-icon { font-size: 28px; opacity: .5; }

/* Animações */
@keyframes pulseExec { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .4; transform: scale(.7); } }
.dot-exec { width: 7px; height: 7px; border-radius: 50%; background: var(--exec); display: inline-block; margin-right: 4px; animation: pulseExec 1.4s ease-in-out infinite; }

/* Skeleton */
.sk { border-radius: 6px; background: linear-gradient(90deg,var(--cinza) 25%,#e4eaf2 50%,var(--cinza) 75%); background-size: 200% 100%; animation: shimmer 1.4s ease-in-out infinite; }
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

/* Toast */
#toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(70px); background: var(--texto); color: #fff; padding: 8px 16px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; box-shadow: var(--sombra-lg); z-index: 999; white-space: nowrap; transition: transform .25s cubic-bezier(.34,1.56,.64,1), opacity .25s; opacity: 0; pointer-events: none; }
#toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
#toast.ok   { background: var(--verde); }
#toast.erro { background: var(--vermelho); }

@media (max-width: 767px) {
  .layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .sidebar { max-height: 50vh; }
  .detalhe { overflow-y: auto; }
  .det-content { overflow-y: visible; }
  header { padding: 0 14px; height: 52px; }
  :root { --header-h: 52px; }
  .layout { height: calc(100vh - 52px); }
  .det-grid4 { grid-template-columns: repeat(2,1fr); }
  .btn-redistribuir { display: none; }
}
</style>
</head>

<script>
function _mapaCarregado() {
  window._mapsCarregado = true;
  if (window._opParaMapa) {
    _renderMapaOp(window._opParaMapa);
    window._opParaMapa = null;
  }
}
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBHwJyS2kSsu7MwOX1xARMIPz4QEXPQofc&callback=_mapaCarregado&language=pt-BR&region=BR" async defer></script>

<header>
  <div class="h-brand">
    <div class="h-logo">
      <img src="./icons/icon-192.png" alt="" onerror="this.style.display='none'">
    </div>
    <div>
      <div class="h-nome">HYDROSISTEM</div>
      <div class="h-sub">Equipe ao vivo</div>
    </div>
  </div>
  <div class="h-btns">
    <span class="live-dot" title="Atualizando ao vivo"></span>
    <a href="./" class="btn-h">← Painel</a>
  </div>
</header>

<div class="layout">
  <div class="sidebar">
    <div class="sb-header">
      <span class="sb-titulo">Operadores</span>
      <span class="sb-badge zero" id="badgeOnline">—</span>
    </div>
    <div class="sb-stats">
      <div class="sb-stat s-on"><div class="sb-stat-n" id="statOnline">—</div><div class="sb-stat-l">Online</div></div>
      <div class="sb-stat s-ex"><div class="sb-stat-n" id="statExec">—</div><div class="sb-stat-l">Executando</div></div>
      <div class="sb-stat s-gps"><div class="sb-stat-n" id="statGps">—</div><div class="sb-stat-l">Com GPS</div></div>
    </div>
    <div class="sb-lista" id="sbLista">
      <div class="sb-vazio">Carregando operadores…</div>
    </div>
    <div class="sb-footer">
      <span id="tsAtualizacao">Atualizando…</span>
      <button class="btn-refresh" id="btnRefresh" onclick="atualizar()">↺ Atualizar</button>
    </div>
  </div>

  <div class="detalhe" id="detalhe">
    <div class="det-vazio" id="detVazio">
      <div class="det-vazio-icon">👷</div>
      <div class="det-vazio-txt">Selecione um operador</div>
      <div class="det-vazio-sub">Clique em qualquer operador para ver detalhes, localização e histórico do dia.</div>
    </div>
    <div class="det-content" id="detContent" style="display:none"></div>
  </div>
</div>

<div id="toast"></div>

<script>
var API_BASE = "https://script.google.com/macros/s/AKfycbxN_o0SVo3hEoWM1MGOBWP8TFNwwp1svZ1icHvrPjcs4R7zGN4IyrFCIfTu2n0wvQ0x/exec";
var REFRESH_MS    = 30000;
var GPS_TTL_MIN   = 10;
var ONLINE_TTL_MIN= 6;

var _operadores = [];
var _protocolos = [];
var _selecionado = null;
var _mapaObj = null;
var _marcadorOp = null;
var _marcadorCirculo = null;
var _refreshTimer = null;

var CORES = ["#1469C7","#15803D","#7C3AED","#A16207","#B91C1C","#0F6E56","#993556","#0369A1","#9D174D"];
function corOp(nome) {
  var h = 0;
  for (var i = 0; i < nome.length; i++) h = nome.charCodeAt(i) + ((h << 5) - h);
  return CORES[Math.abs(h) % CORES.length];
}
function iniciaisOp(nome) {
  return nome.trim().split(/\s+/).map(function(w){ return w[0]||""; }).join("").slice(0,2).toUpperCase() || "OP";
}

var _toastTimer = null;
function toast(msg, tipo) {
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "show " + (tipo||"");
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(function(){ el.className = ""; }, 3000);
}

function safeText(s) {
  var d = document.createElement("div");
  d.textContent = String(s||"");
  return d.innerHTML;
}

function minutosDesde(iso) {
  if (!iso) return 9999;
  return (Date.now() - new Date(iso).getTime()) / 60000;
}

function formatarTempo(min) {
  if (min < 1) return "agora";
  if (min < 60) return Math.round(min) + "min";
  var h = Math.floor(min / 60), m = Math.round(min % 60);
  return h + "h" + (m > 0 ? " " + m + "min" : "");
}

function formatarHora(iso) {
  if (!iso) return "—";
  return new Date(iso).toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"});
}

function formatarDataHora(iso) {
  if (!iso) return "—";
  return new Date(iso).toLocaleString("pt-BR", {day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
}

function formatarDuracao(min) {
  if (min == null || isNaN(min)) return "—";
  if (min < 60) return min + "min";
  return Math.floor(min/60) + "h " + (min%60) + "m";
}

function atualizar() {
  var btn = document.getElementById("btnRefresh");
  if (btn) btn.classList.add("spin");

  var urlPresencas = API_BASE + "?acao=presencas&t=" + Date.now();
  var urlDados     = API_BASE + "?acao=dados&t=" + Date.now();

  Promise.all([
    fetch(urlPresencas, {redirect:"follow"})
      .then(function(r){ return r.json(); })
      .catch(function(e){ console.error("[presencas] erro:", e); return {ok:false, presencas:[]}; }),
    fetch(urlDados, {redirect:"follow"})
      .then(function(r){ return r.json(); })
      .catch(function(e){ console.error("[dados] erro:", e); return []; })
  ]).then(function(res) {
    if (btn) btn.classList.remove("spin");
    var presRes = res[0], dados = res[1];
    if (presRes.ok) _operadores = presRes.presencas || [];
    _protocolos = Array.isArray(dados) ? dados : [];
    renderLista();
    document.getElementById("tsAtualizacao").textContent = "Atualizado às " + new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  }).catch(function(e) {
    if (btn) btn.classList.remove("spin");
    console.error("[atualizar] erro geral:", e);
    toast("❌ Erro ao atualizar", "erro");
  });
}

function _enriquecerOperadores() {
  var lockMap = {};
  _protocolos.forEach(function(p) {
    if (p.lock) lockMap[p.lock.sessionId] = p;
  });

  var hoje = new Date().toDateString();
  var operadoresFiltrados = _operadores.filter(function(op) { return !op.supervisor; });

  operadoresFiltrados.forEach(function(op) {
    op._online     = minutosDesde(op.timestamp) < ONLINE_TTL_MIN;
    op._temGps     = op.lat != null && op.lng != null && minutosDesde(op.gpsTs) < GPS_TTL_MIN && (op.accuracy == null || op.accuracy < 150);
    op._protocolo  = lockMap[op.sessionId] || null;
    op._executando = !!op._protocolo;

    /* Histórico do dia: protocolos concluídos hoje por este operador */
    op._historico = _protocolos.filter(function(p) {
      var concl = (p.status||"").toUpperCase().trim();
      var ehConcluido = concl === "CONCLUÍDO" || concl === "CONCLUIDO";
      if (!ehConcluido) return false;
      var nomeOp = (p.operadorConclusao || p.registradoPor || "").trim().toLowerCase();
      var nomeAtual = (op.operador || "").trim().toLowerCase();
      var mesmoOp = nomeOp === nomeAtual;
      var hoje2 = p.dataConclusao && new Date(p.dataConclusao).toDateString() === hoje;
      return mesmoOp && hoje2;
    }).map(function(p) {
      var dur = (p.dataHora && p.dataConclusao)
        ? Math.round((new Date(p.dataConclusao) - new Date(p.dataHora)) / 60000)
        : null;
      return { protocolo: p.protocolo, endereco: p.endereco, dataConclusao: p.dataConclusao, duracaoMin: dur };
    }).sort(function(a,b){ return new Date(b.dataConclusao) - new Date(a.dataConclusao); });

    op._conclHoje = op._historico.length;

    /* Taxa de conclusão */
    var totalOp = _protocolos.filter(function(p) {
      var nomeOp = (p.operadorConclusao || p.registradoPor || "").trim().toLowerCase();
      return nomeOp === (op.operador||"").trim().toLowerCase();
    }).length;
    op._taxa = totalOp > 0 ? Math.round(op._conclHoje / totalOp * 100) : 0;
  });

  operadoresFiltrados.sort(function(a,b) {
    var ra = a._executando ? 0 : a._online ? 1 : 2;
    var rb = b._executando ? 0 : b._online ? 1 : 2;
    return ra - rb;
  });

  return operadoresFiltrados;
}

function renderLista() {
  var lista = _enriquecerOperadores();
  window._operadoresFiltrados = lista;

  var online = lista.filter(function(o){ return o._online; }).length;
  var exec   = lista.filter(function(o){ return o._executando; }).length;
  var gps    = lista.filter(function(o){ return o._temGps; }).length;

  document.getElementById("statOnline").textContent = online;
  document.getElementById("statExec").textContent   = exec;
  document.getElementById("statGps").textContent    = gps;

  var badge = document.getElementById("badgeOnline");
  badge.textContent = online + " online";
  badge.className   = "sb-badge" + (online === 0 ? " zero" : "");

  var sbLista = document.getElementById("sbLista");
  if (!lista.length) {
    sbLista.innerHTML = "<div class='sb-vazio'>Nenhum operador encontrado.</div>";
    return;
  }

  var html = "";
  lista.forEach(function(op, idx) {
    var cor = corOp(op.operador);
    var statusCls = op._executando ? "exec" : op._online ? "online" : "offline";
    var statusTxt = op._executando
      ? "<span class='dot-exec'></span>Executando " + safeText(op._protocolo.protocolo)
      : op._online
        ? (minutosDesde(op.timestamp) < 1 ? "online agora" : "há " + formatarTempo(minutosDesde(op.timestamp)))
        : "offline há " + formatarTempo(minutosDesde(op.timestamp));
    var gpsIcon = op._temGps ? "📍" : "📵";

    var selecionadoCls = (_selecionado && _selecionado.sessionId === op.sessionId)
      ? " selected" + (op._executando ? " exec" : "") : "";
    var offlineCls = !op._online ? " offline" : "";

    var conclCls = op._conclHoje === 0 ? "op-concl zero" : "op-concl";

    html += "<div class='op-card" + selecionadoCls + offlineCls + "' onclick='selecionarOp(" + idx + ")'>" +
      "<div class='op-avatar' style='background:" + cor + "'>" +
        "<i class='fa-solid fa-user' style='font-size:13px'></i>" +
        "<div class='op-avatar-status' style='background:" + (op._online?"#4ade80":"#94A3B8") + "'></div>" +
      "</div>" +
      "<div class='op-info'>" +
        "<div class='op-nome'>" + safeText(op.operador) + "</div>" +
        "<div class='op-status " + statusCls + "'>" + statusTxt + "</div>" +
      "</div>" +
      "<div class='op-right'>" +
        "<span class='" + conclCls + "'>✅ " + op._conclHoje + " hoje</span>" +
        "<span class='op-gps' title='" + (op._temGps?"GPS ativo":"Sem GPS") + "'>" + gpsIcon + "</span>" +
      "</div>" +
    "</div>";
  });

  sbLista.innerHTML = html;

  if (_selecionado) {
    var atualizado = lista.find(function(o){ return o.sessionId === _selecionado.sessionId; });
    if (atualizado) { _selecionado = atualizado; renderDetalhe(); }
  }
}

function selecionarOp(idx) {
  var lista = window._operadoresFiltrados || [];
  _selecionado = lista[idx];
  renderLista();
  renderDetalhe();
}

function renderDetalhe() {
  if (!_selecionado) return;
  var op = _selecionado;
  var cor = corOp(op.operador);

  document.getElementById("detVazio").style.display = "none";
  var content = document.getElementById("detContent");
  content.style.display = "flex";

  var statusLabel = op._executando ? "Em execução" : op._online ? "Online" : "Offline";
  var statusCls   = op._executando ? "exec"        : op._online ? "online"  : "offline";
  var gpsBadge    = op._temGps
    ? "<span class='badge gps-on'>📍 GPS ativo</span>"
    : "<span class='badge gps-off'>📵 GPS inativo</span>";
  var minOnline = minutosDesde(op.timestamp);
  var minGps    = minutosDesde(op.gpsTs);

  /* Botão redistribuir só se executando */
  var btnRedist = op._executando
    ? "<button class='btn-redistribuir' onclick='abrirRedistribuir()'><i class='fa-solid fa-arrows-rotate' style='font-size:12px'></i> Redistribuir</button>"
    : "";

  /* Mini cards */
  var minExec = op._executando && op._protocolo && op._protocolo.lock
    ? minutosDesde(op._protocolo.lock.iniciadoEm || op._protocolo.lock.timestamp)
    : null;

  var miniHtml = "<div class='det-grid4'>" +
    "<div class='mini-card'><div class='mini-card-val verde'>" + op._conclHoje + "</div><div class='mini-card-lbl'>Concluídos hoje</div></div>" +
    "<div class='mini-card'><div class='mini-card-val " + (op._executando?"exec":"texto3") + "'>" + (op._executando && minExec!=null ? formatarTempo(minExec) : "—") + "</div><div class='mini-card-lbl'>Em execução</div></div>" +
    "<div class='mini-card'><div class='mini-card-val " + (op._temGps?"azul":"texto3") + "'>" + (op._temGps ? (op.accuracy ? Math.round(op.accuracy)+"m" : "Ativo") : "—") + "</div><div class='mini-card-lbl'>Precisão GPS</div></div>" +
    "<div class='mini-card'><div class='mini-card-val " + (op._conclHoje>0?"verde":"texto3") + "'>" + (op._conclHoje > 0 ? op._taxa+"%" : "—") + "</div><div class='mini-card-lbl'>Taxa conclusão</div></div>" +
  "</div>";

  /* Protocolo em execução */
  var protoHtml = "";
  if (op._executando && op._protocolo) {
    var p = op._protocolo;
    var mapsLink = (p.lat && p.lng)
      ? "https://maps.google.com/?q=" + p.lat + "," + p.lng
      : "https://maps.google.com/?q=" + encodeURIComponent((p.endereco||"") + ", Arapongas, PR");
    protoHtml = "<div class='det-section exec-border'>" +
      "<div class='det-section-title'>🚧 Protocolo em execução</div>" +
      "<div class='det-row'><div class='det-row-lbl'>Protocolo</div><div class='det-row-val' style='font-family:DM Mono,monospace;font-size:12px;color:var(--texto3)'>" + safeText(p.protocolo) + "</div></div>" +
      "<div class='det-row'><div class='det-row-lbl'>Endereço</div><div class='det-row-val'><a href='" + mapsLink + "' target='_blank' rel='noopener'>📍 " + safeText(p.endereco) + "</a></div></div>" +
      "<div class='det-row'><div class='det-row-lbl'>Tempo em execução</div><div class='det-row-val' style='font-weight:700;color:var(--exec)'>" + (minExec!=null?formatarTempo(minExec):"—") + "</div></div>" +
      "<div class='det-row'><div class='det-row-lbl'>Iniciado às</div><div class='det-row-val'>" + formatarHora(p.lock ? (p.lock.iniciadoEm || p.lock.timestamp) : null) + "</div></div>" +
    "</div>";
  }

  /* Mapa GPS */
  var mapaHtml = "<div class='det-mapa-wrap'>" +
    "<div class='det-mapa-header'>" +
      "<span class='det-mapa-titulo'>🗺️ Localização GPS" +
        (op._temGps ? " <span style='color:var(--verde);font-size:11px;font-weight:600'>● ao vivo</span>" : "") +
      "</span>" +
      (op._temGps ? "<span class='det-mapa-atualizado'>Atualizado há " + formatarTempo(minGps) + "</span>" : "") +
    "</div>" +
    (op._temGps
      ? "<div id='mapaOperador'></div>"
      : "<div class='det-mapa-vazio'><div class='det-mapa-vazio-icon'>📵</div><span>GPS não disponível para este operador</span></div>"
    ) +
  "</div>";

  /* Histórico do dia */
  var histHtml = "<div class='det-section'>" +
    "<div class='det-section-title'>📋 Histórico do dia</div>";

  if (op._historico && op._historico.length > 0) {
    op._historico.forEach(function(h) {
      histHtml += "<div class='hist-item'>" +
        "<div class='hist-stripe' style='background:var(--verde)'></div>" +
        "<div class='hist-info'>" +
          "<div class='hist-end'>" + safeText(h.endereco || "—") + "</div>" +
          "<div class='hist-meta'>" + safeText(h.protocolo) + " · " + formatarHora(h.dataConclusao) + "</div>" +
        "</div>" +
        "<div class='hist-dur'>" + formatarDuracao(h.duracaoMin) + "</div>" +
      "</div>";
    });
  }

  if (op._executando && op._protocolo) {
    histHtml += "<div class='hist-item'>" +
      "<div class='hist-stripe' style='background:var(--exec)'></div>" +
      "<div class='hist-info'>" +
        "<div class='hist-end'>" + safeText(op._protocolo.endereco || "—") + "</div>" +
        "<div class='hist-meta'>" + safeText(op._protocolo.protocolo) + " · em execução</div>" +
      "</div>" +
      "<div class='hist-dur' style='color:var(--exec)'>⏱ em andamento</div>" +
    "</div>";
  }

  if ((!op._historico || op._historico.length === 0) && !op._executando) {
    histHtml += "<div style='padding:16px;text-align:center;color:var(--texto3);font-size:13px'>Nenhuma conclusão hoje</div>";
  }

  histHtml += "</div>";

  content.innerHTML =
    "<div class='det-hero'>" +
      "<div class='det-avatar-big' style='background:" + cor + "'>" +
        "<i class='fa-solid fa-user' style='font-size:20px'></i>" +
        "<div class='op-avatar-status' style='background:" + (op._online?"#4ade80":"#94A3B8") + ";width:14px;height:14px;border-width:2.5px'></div>" +
      "</div>" +
      "<div class='det-hero-info'>" +
        "<div class='det-nome'>" + safeText(op.operador) + "</div>" +
        "<div class='det-sub'>" +
          (op._executando
            ? "Em execução há " + (minExec!=null?formatarTempo(minExec):"—")
            : op._online
              ? "Online há " + formatarTempo(minOnline)
              : "Offline há " + formatarTempo(minOnline)) +
        "</div>" +
        "<div class='det-badges'>" +
          "<span class='badge " + statusCls + "'>" + statusLabel + "</span>" +
          gpsBadge +
        "</div>" +
      "</div>" +
      btnRedist +
    "</div>" +
    miniHtml +
    protoHtml +
    mapaHtml +
    histHtml;

  if (op._temGps) {
    setTimeout(function() { _iniciarMapaOp(op); }, 50);
  } else {
    _mapaObj = null;
  }
}

/* Redistribuir — abre o painel principal na redistribuição */
function abrirRedistribuir() {
  if (!_selecionado || !_selecionado._protocolo) return;
  var p = _selecionado._protocolo;
  toast("↔ Redistribuição disponível no Painel principal", "");
}

/* Mapa */
function _iniciarMapaOp(op) {
  if (window._mapsCarregado) {
    _renderMapaOp(op);
  } else {
    window._opParaMapa = op;
  }
}

window._mapaCarregado = function() {
  window._mapsCarregado = true;
  if (window._opParaMapa) {
    setTimeout(function() {
      _renderMapaOp(window._opParaMapa);
      window._opParaMapa = null;
    }, 50);
  }
};

function _renderMapaOp(op) {
  var el = document.getElementById("mapaOperador");
  if (!el) return;

  var pos = { lat: parseFloat(op.lat), lng: parseFloat(op.lng) };

  _mapaObj = new google.maps.Map(el, {
    center: pos, zoom: 15,
    mapTypeControl: false, streetViewControl: false, fullscreenControl: false,
    styles: [
      { featureType:"poi", elementType:"labels", stylers:[{visibility:"off"}] },
      { featureType:"transit", elementType:"labels", stylers:[{visibility:"off"}] }
    ]
  });

  if (_marcadorOp)      { _marcadorOp.setMap(null); _marcadorOp = null; }
  if (_marcadorCirculo) { _marcadorCirculo.setMap(null); _marcadorCirculo = null; }

  var cor = corOp(op.operador);
  var ini = iniciaisOp(op.operador);

  if (op.accuracy) {
    _marcadorCirculo = new google.maps.Circle({
      center: pos, radius: op.accuracy,
      fillColor: cor, fillOpacity: .12,
      strokeColor: cor, strokeOpacity: .4, strokeWeight: 1,
      map: _mapaObj
    });
  }

  var svgContent =
    '<svg xmlns="http://www.w3.org/2000/svg" width="44" height="54" viewBox="0 0 44 54">' +
    '<path d="M22 0C13.2 0 6 7.2 6 16c0 12 16 38 16 38S38 28 38 16C38 7.2 30.8 0 22 0z" fill="' + cor + '"/>' +
    '<circle cx="22" cy="16" r="11" fill="white" opacity="0.92"/>' +
    '<text x="22" y="21" text-anchor="middle" font-size="10" font-weight="800" font-family="DM Sans,sans-serif" fill="' + cor + '">' + ini + '</text>' +
    '</svg>';

  _marcadorOp = new google.maps.Marker({
    position: pos, map: _mapaObj,
    icon: { url: "data:image/svg+xml;base64," + window.btoa(svgContent), scaledSize: new google.maps.Size(44, 54), anchor: new google.maps.Point(22, 54) },
    title: op.operador
  });

  var minGps = minutosDesde(op.gpsTs);
  var execInfo = op._executando && op._protocolo
    ? "<div style='color:#7C3AED;font-weight:600;margin-top:4px;font-size:11px'>🚧 " + safeText(op._protocolo.protocolo) + " — " + safeText((op._protocolo.endereco||"").split(",")[0]) + "</div>"
    : "";
  var iw = new google.maps.InfoWindow({
    content: "<div style='font-family:DM Sans,sans-serif;padding:2px'>" +
      "<div style='font-weight:700;font-size:13px'>" + safeText(op.operador) + "</div>" +
      "<div style='font-size:11px;color:#64748B;margin-top:2px'>GPS atualizado há " + formatarTempo(minGps) + "</div>" +
      execInfo +
      "<a href='https://maps.google.com/?q=" + op.lat + "," + op.lng + "' target='_blank' rel='noopener' style='display:block;margin-top:8px;padding:5px 10px;background:#EBF3FD;border-radius:6px;color:#1469C7;font-size:11px;font-weight:700;text-decoration:none;text-align:center'>Abrir no Google Maps ↗</a>" +
    "</div>"
  });
  _marcadorOp.addListener("click", function() { iw.open(_mapaObj, _marcadorOp); });
}

function iniciarRefresh() {
  clearInterval(_refreshTimer);
  _refreshTimer = setInterval(atualizar, REFRESH_MS);
}

atualizar();
iniciarRefresh();

document.addEventListener("visibilitychange", function() {
  if (document.visibilityState === "visible") { atualizar(); iniciarRefresh(); }
  else { clearInterval(_refreshTimer); }
});
</script>
</body>
</html>
